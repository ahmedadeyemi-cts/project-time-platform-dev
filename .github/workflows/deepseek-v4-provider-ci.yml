name: Validate DeepSeek v4 Provider
on:
  pull_request:
    paths:
      - 'src/backend/ProjectTime.Api/Ai/**'
      - 'src/backend/ProjectTime.Api/Modules/AiProviderConfigurationModule.cs'
      - 'tests/DeepSeekProviderTests/**'
      - '.github/workflows/deepseek-v4-provider-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/DeepSeekProviderTests/DeepSeekProviderTests.csproj --configuration Release
      - run: git diff --check
